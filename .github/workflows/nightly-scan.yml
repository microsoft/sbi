# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Nightly Registry Scan

on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC nightly
  workflow_dispatch: {}

concurrency:
  group: nightly-registry-scan
  cancel-in-progress: false

permissions: {}

jobs:
  scan-and-update:
    name: 🔍 Scan & Update
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      # Authentication: uses a deploy key (SSH) for direct push to main.
      # The deploy key must be added as a bypass actor in the branch
      # protection ruleset. See https://github.com/microsoft/sbi/issues/6

      - name: ⤵️ Checkout (with LFS)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ssh-key: ${{ secrets.NIGHTLY_WRITE_BOT_KEY }}
          lfs: true
          fetch-depth: 0

      - name: ✅ Require default branch for manual runs
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "::error::Run workflow_dispatch from ${DEFAULT_BRANCH} only."
            exit 1
          fi

      - name: 🚧 Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: 🚧 Setup Task
        uses: go-task/setup-task@3be4020d41929789a01026e0e427a4321ce0ad44 # v2.0.0

      - name: 🔀 Download dependencies
        run: go mod download

      - name: 🏗️ Build
        run: task build

      - name: 📌 Load tool versions
        run: |
          source .github/tool-versions.sh
          echo "SYFT_VERSION=$SYFT_VERSION" >> "$GITHUB_ENV"
          echo "SYFT_INSTALLER_SHA=$SYFT_INSTALLER_SHA" >> "$GITHUB_ENV"
          echo "TRIVY_VERSION=$TRIVY_VERSION" >> "$GITHUB_ENV"
          echo "TRIVY_INSTALLER_SHA=$TRIVY_INSTALLER_SHA" >> "$GITHUB_ENV"

      - name: 🔧 Install Syft
        run: |
          curl -sSfL "https://raw.githubusercontent.com/anchore/syft/${SYFT_INSTALLER_SHA}/install.sh" | sh -s -- -b /usr/local/bin "${SYFT_VERSION}"

      - name: 🔧 Install Trivy
        run: |
          curl -sSfL "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_INSTALLER_SHA}/contrib/install.sh" | sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"

      - name: 🐳 Docker info
        run: docker info

      - name: 🔍 Run nightly scan
        run: |
          ./bin/linux-amd64/sbi scan \
            --database azure_linux_images.db \
            --config-dir config \
            --output docs/daily_recommendations.md \
            --max-tags 0 \
            --comprehensive \
            --update-existing \
            -v

      - name: 📊 Show database stats
        run: |
          ls -lh azure_linux_images.db || true
          sqlite3 azure_linux_images.db 'SELECT COUNT(*) as images FROM images;' || true

      - name: 📝 Commit & push updates
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Source the shared allowlist from the trusted triggering commit
          # so earlier tooling cannot taint the file list.
          git restore --source='${{ github.sha }}' -- .github/nightly-allowed-files.sh
          source .github/nightly-allowed-files.sh

          is_allowed_file() {
            local candidate="$1"
            local allowed_file

            for allowed_file in "${NIGHTLY_ALLOWED_FILES[@]}"; do
              if [ "$candidate" = "$allowed_file" ]; then
                return 0
              fi
            done

            return 1
          }

          # Validate expected scan artifacts exist
          MISSING=()
          for f in "${NIGHTLY_ALLOWED_FILES[@]}"; do
            [ -f "$f" ] || MISSING+=("$f")
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing expected scan artifacts:"
            printf '  - %s\n' "${MISSING[@]}"
            exit 1
          fi

          # Validate the full working tree so unexpected files cannot be
          # hidden by selectively staging only the allowlisted outputs.
          UNEXPECTED=()
          while IFS= read -r -d '' file; do
            if ! is_allowed_file "$file"; then
              UNEXPECTED+=("$file")
            fi
          done < <(git diff --name-only -z)
          while IFS= read -r -d '' file; do
            if ! is_allowed_file "$file"; then
              UNEXPECTED+=("$file")
            fi
          done < <(git ls-files --others --exclude-standard -z)
          if [ ${#UNEXPECTED[@]} -gt 0 ]; then
            echo "::error::Nightly scan produced unexpected file changes:"
            printf '  - %s\n' "${UNEXPECTED[@]}"
            exit 1
          fi

          git add -f "${NIGHTLY_ALLOWED_FILES[@]}"
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo 'No changes to commit.'
            exit 0
          fi

          # Final staged-file validation
          while IFS= read -r -d '' file; do
            if ! is_allowed_file "$file"; then
              echo "::error::Unexpected file staged: $file"
              exit 1
            fi
          done < <(git diff --cached --name-only -z)

          CHANGED_FILES=$(git diff --cached --name-only | tr '\n' ' ')
          echo "Changed files: $CHANGED_FILES"
          git commit -m "chore: update nightly scan results [skip ci]"
          git push

      - name: 📤 Upload database artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-database
          path: azure_linux_images.db
          retention-days: 5
